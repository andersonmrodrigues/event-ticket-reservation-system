services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tickets -d tickets']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    command: ['node', 'dist/scripts/migrate.js']
    environment:
      DATABASE_URL: postgres://tickets:tickets@postgres:5432/tickets
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: .
    command: ['node', 'dist/src/main.js']
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://tickets:tickets@postgres:5432/tickets
      REDIS_URL: redis://redis:6379
      CAPABILITY_KEYS: local-v1:replace-this-local-key-with-at-least-32-characters
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports: ['3000:3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  worker:
    build: .
    command: ['node', 'dist/src/worker.js']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://tickets:tickets@postgres:5432/tickets
      REDIS_URL: redis://redis:6379
      CAPABILITY_KEYS: local-v1:replace-this-local-key-with-at-least-32-characters
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
